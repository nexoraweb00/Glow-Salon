<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Glow Salon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Product Details Page Specific Styles */
        .product-container {
            max-width: 1000px;
            margin: 150px auto 80px;
            display: flex;
            gap: 50px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }
        .product-image {
            flex: 1;
        }
        .product-image img {
            width: 100%;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .product-info h1 {
            font-size: 36px;
            color: var(--dark);
            margin-bottom: 10px;
        }
        .product-info .price {
            font-size: 24px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 20px;
        }
        .product-info p {
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }
        .btn-order {
            padding: 15px 30px;
            background: var(--dark);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
        }
        .btn-order:hover {
            background: var(--primary);
            transform: translateY(-3px);
        }

        /* Order Form Modal */
        .order-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;
        }
        .order-modal-content {
            background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px;
            position: relative; animation: fadeUp 0.3s ease;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #888; }
        .order-modal h2 { margin-bottom: 20px; color: var(--dark); text-align: center; }
        .order-modal input, .order-modal textarea {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; 
            border-radius: 8px; font-family: 'Poppins', sans-serif; outline: none;
        }
        .order-modal input:focus, .order-modal textarea:focus { border-color: var(--primary); }

        @media (max-width: 768px) {
            .product-container { flex-direction: column; margin-top: 100px; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Glow<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Product Details Section -->
    <div class="product-container">
        <div class="product-image">
            <img id="pImage" src="" alt="Product Image">
        </div>
        <div class="product-info">
            <h1 id="pName">Loading...</h1>
            <div class="price" id="pPrice">$0.00</div>
            <p id="pDesc">Loading description...</p>
            
            <button class="btn-order" onclick="openOrderModal()">Order Now <i class="fas fa-shopping-bag"></i></button>
        </div>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="order-modal">
        <div class="order-modal-content">
            <span class="close-modal" onclick="closeOrderModal()">&times;</span>
            <h2>Place Your Order</h2>
            <form id="orderForm">
                <input type="text" id="cName" placeholder="Your Name" required>
                <input type="email" id="cEmail" placeholder="Email Address" required>
                <input type="tel" id="cPhone" placeholder="Mobile Number" required>
                <textarea id="cAddress" rows="3" placeholder="Delivery Address" required></textarea>
                
                <button type="submit" class="btn-order" style="width: 100%;">Confirm Order</button>
            </form>
        </div>
    </div>

        <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      
        const firebaseConfig = {
  apiKey: "AIzaSyDkBPWm-aUq7wGrcf0IaiBpjmrzwl9VT5o",
  authDomain: "luxury-salon-a871c.firebaseapp.com",
  projectId: "luxury-salon-a871c",
  storageBucket: "luxury-salon-a871c.firebasestorage.app",
  messagingSenderId: "689445019169",
  appId: "1:689445019169:web:681de187aaede0eb8a0d60",
  measurementId: "G-XQ706J5L9X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); 

       
        const urlParams = new URLSearchParams(window.location.search);
        const productName = urlParams.get('name');
        const productPrice = urlParams.get('price');
        const productDesc = urlParams.get('desc');
        const productImg = urlParams.get('img');

  
        if (productName) {
            document.getElementById('pName').innerText = productName;
            document.getElementById('pPrice').innerText = productPrice;
            document.getElementById('pDesc').innerText = productDesc;
            document.getElementById('pImage').src = productImg;
            document.title = productName + " | Glow Salon";
        }

     
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const cName = document.getElementById('cName');
                const cEmail = document.getElementById('cEmail');
                const cAddress = document.getElementById('cAddress');

               
                cName.value = user.displayName || '';
                cEmail.value = user.email || '';
                
             
                if(cName.value) cName.readOnly = true;
                if(cEmail.value) cEmail.readOnly = true;

          
                try {
                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.address) {
                            cAddress.value = data.address;
                            cAddress.readOnly = true; 
                        }
                    }
                } catch (error) {
                    console.log("Error fetching profile:", error);
                }
            }
        });

      
        const modal = document.getElementById('orderModal');
        window.openOrderModal = function() { modal.style.display = 'flex'; }
        window.closeOrderModal = function() { modal.style.display = 'none'; }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
               
                await addDoc(collection(db, "productOrders"), {
                    customerName: document.getElementById('cName').value,
                    email: document.getElementById('cEmail').value,
                    mobile: document.getElementById('cPhone').value,
                    address: document.getElementById('cAddress').value,
                    productName: productName,
                    price: productPrice,
                    status: "Pending",
                    userId: auth.currentUser ? auth.currentUser.uid : "guest", 
                    orderDate: new Date()
                });

                alert("Order placed successfully! 🌸 We will contact you soon.");
                closeOrderModal();
                
                
                if(!auth.currentUser) {
                    document.getElementById('orderForm').reset();
                } else {
                    document.getElementById('cPhone').value = "";
                }

            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.innerText = "Confirm Order";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
