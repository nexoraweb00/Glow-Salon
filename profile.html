<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Glow Beauty Salon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Profile Page Specific Styles */
        .profile-container {
            max-width: 600px;
            margin: 150px auto 100px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-header h2 {
            font-size: 28px;
            color: var(--dark);
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }
        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        .profile-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-save {
            background: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-save:hover { background: var(--dark); }
        
        .btn-logout {
            background: transparent;
            color: #f44336;
            padding: 15px;
            border: 2px solid #f44336;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-logout:hover { background: #f44336; color: white; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Glow<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#gallery">Gallery</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Profile Section -->
    <div class="profile-container">
        <div class="profile-header">
            <h2 id="display-email">Loading...</h2>
        </div>

        <form id="profile-form">
            
            <div class="form-group" style="text-align: center;">
                <label>Profile Picture</label>
                <div>
                  
                    <img id="profile-pic" src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y" alt="Profile Picture" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); margin-bottom: 15px;">
                </div>
           
                <button type="button" id="upload_widget" class="btn-secondary" style="padding: 10px 20px; font-size: 14px; border-radius: 50px; cursor: pointer;">
                    <i class="fas fa-camera"></i> Upload New Photo
                </button>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label>Email Address (Cannot change)</label>
                <input type="email" id="email" disabled>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea id="address" rows="3" placeholder="Enter your address"></textarea>
            </div>

            <div class="profile-buttons">
                <button type="submit" class="btn-save">Save Changes</button>
                <button type="button" id="logout-btn" class="btn-logout">Logout</button>
            </div>
        </form>
    </div>

    <!-- Cloudinary Widget Script -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <!-- Firebase & Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

       
        const firebaseConfig = {
  apiKey: "AIzaSyDkBPWm-aUq7wGrcf0IaiBpjmrzwl9VT5o",
  authDomain: "luxury-salon-a871c.firebaseapp.com",
  projectId: "luxury-salon-a871c",
  storageBucket: "luxury-salon-a871c.firebasestorage.app",
  messagingSenderId: "689445019169",
  appId: "1:689445019169:web:681de187aaede0eb8a0d60",
  measurementId: "G-XQ706J5L9X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let newPhotoURL = ""; 

        const profileForm = document.getElementById('profile-form');
        const profilePic = document.getElementById('profile-pic');
        const displayEmail = document.getElementById('display-email');
        
        const nameInput = document.getElementById('name');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const ageInput = document.getElementById('age');
        const genderInput = document.getElementById('gender');
        const addressInput = document.getElementById('address');
        const logoutBtn = document.getElementById('logout-btn');
        const uploadBtn = document.getElementById('upload_widget');

        if (typeof cloudinary !== 'undefined' && uploadBtn) {
            var myWidget = cloudinary.createUploadWidget({
                cloudName: 'motpipab', 
                uploadPreset: 'Luxury salon',
                cropping: true, 
                croppingAspectRatio: 1, 
                multiple: false,
                sources: ['local', 'camera', 'url'], 
                maxFileSize: 5000000 
            }, (error, result) => { 
                if (!error && result && result.event === "success") { 
                    newPhotoURL = result.info.secure_url; 
                    profilePic.src = newPhotoURL; 
                }
            });

            uploadBtn.addEventListener("click", function(){ 
                myWidget.open(); 
            }, false);
        } else {
            console.log("Cloudinary script එක හෝ Upload Button එක හොයාගන්න නෑ!");
        }

       
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                displayEmail.textContent = user.email;
                emailInput.value = user.email;
                nameInput.value = user.displayName || '';
                newPhotoURL = user.photoURL || ""; 
                profilePic.src = user.photoURL || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';

                try {
                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        usernameInput.value = data.username || '';
                        ageInput.value = data.age || '';
                        genderInput.value = data.gender || '';
                        addressInput.value = data.address || '';
                    }
                } catch (error) {
                    console.log("Error getting document:", error);
                }
            } else {
                window.location.href = "index.html";
            }
        });

        //  (Save Changes)
        if (profileForm) {
            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentUser) return alert("Please login again.");

                const submitBtn = profileForm.querySelector('.btn-save');
                submitBtn.textContent = "Saving...";
                submitBtn.disabled = true;

                try {
                    await updateProfile(currentUser, {
                        displayName: nameInput.value,
                        photoURL: newPhotoURL 
                    });

                    await setDoc(doc(db, "users", currentUser.uid), {
                        username: usernameInput.value,
                        age: ageInput.value,
                        gender: genderInput.value,
                        address: addressInput.value,
                        email: currentUser.email,
                        photoURL: newPhotoURL, 
                        updatedAt: new Date()
                    }, { merge: true });

                    alert("Profile updated successfully! 🌸");
                    
                } catch (error) {
                    alert("Error updating profile: " + error.message);
                    console.error(error);
                } finally {
                    submitBtn.textContent = "Save Changes";
                    submitBtn.disabled = false;
                }
            });
        }

        // Logout
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                try {
                    await signOut(auth);
                    window.location.href = "index.html";
                } catch (error) {
                    alert("Error logging out: " + error.message);
                }
            });
        }
    </script>
</body>
</html>
